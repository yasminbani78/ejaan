<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jom Eja! Latihan Ejaan Tahun 2 & 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF4FB; --sheet:#FFFFFF; --ink:#1E2A5A; --muted:#58648C; --line:#CFDCEF;
  --red:#E0453A; --leaf:#1F9A5E; --sky:#2F7BD0;
  --ok-bg:#E2F5EA; --bad-bg:#FDE6E3;
  --b1:#FFD45C; --b2:#86CCFF; --b3:#92E0AC; --b4:#FFAFA6; --btxt:#1E2A5A;
  --gap:#FFF2C2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131A33; --sheet:#1C2447; --ink:#EEF2FF; --muted:#A8B2D8; --line:#334075;
    --ok-bg:#163A2A; --bad-bg:#4A2220; --gap:#3B3520;
  }
}
:root[data-theme="dark"]{
  --paper:#131A33; --sheet:#1C2447; --ink:#EEF2FF; --muted:#A8B2D8; --line:#334075;
  --ok-bg:#163A2A; --bad-bg:#4A2220; --gap:#3B3520;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Andika","Trebuchet MS","Verdana",sans-serif;
  font-size:18px; line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 48px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0}
.blk{display:inline-block;font-weight:700;color:var(--btxt);border-radius:10px;padding:.05em .32em;
  box-shadow:0 4px 0 rgba(30,42,90,.25);line-height:1.25}
.brand .blk{font-size:30px}
.brand .blk:nth-child(1){background:var(--b1);transform:rotate(-4deg)}
.brand .blk:nth-child(2){background:var(--b2);transform:rotate(3deg)}
.brand .blk:nth-child(3){background:var(--b3);transform:rotate(-2deg)}
.brand .bang{font-size:34px;font-weight:700;color:var(--red);margin-left:2px}
.tools{display:flex;gap:8px;align-items:center}
.pill{background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;display:inline-flex;gap:6px;align-items:center}

/* exercise-book sheet */
.sheet{background:var(--sheet);border-radius:18px;border:2px solid var(--line);
  position:relative;padding:22px 22px 22px 40px;margin-top:16px}
.sheet::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--red);opacity:.55}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}
h2{font-size:22px;margin:0 0 8px}
p{margin:0 0 10px;max-width:62ch}
.muted{color:var(--muted)}

.years{display:inline-flex;background:var(--paper);border-radius:14px;padding:5px;gap:4px;margin:10px 0 4px}
.years button{border:0;background:none;padding:10px 20px;border-radius:10px;font-weight:700;font-size:18px}
.years button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:16px}
.topic{text-align:left;background:var(--sheet);border:2px solid var(--line);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:8px;transition:transform .12s, border-color .12s}
.topic:hover{border-color:var(--sky);transform:translateY(-2px)}
.topic .name{font-weight:700;font-size:19px;line-height:1.25}
.topic .eg{display:flex;flex-wrap:wrap;gap:4px}
.mini{font-size:15px;font-weight:700;color:var(--btxt);border-radius:7px;padding:1px 7px}
.stars{color:#E9A800;letter-spacing:2px;font-size:18px}
.stars .off{color:var(--line)}

.rule{background:var(--paper);border-radius:14px;padding:14px 16px;margin:12px 0 18px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.act{display:flex;gap:12px;align-items:center;text-align:left;background:var(--sheet);border:2px solid var(--line);
  border-radius:16px;padding:14px}
.act:hover{border-color:var(--sky)}
.act .ic{font-size:34px;line-height:1}
.act b{display:block;font-size:18px}
.act small{color:var(--muted);font-size:15px}

.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--sky);font-size:17px}

/* game */
.bar{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.track{flex:1;height:12px;background:var(--paper);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--leaf);border-radius:99px;transition:width .3s}
.count{font-weight:700;white-space:nowrap}
.q{text-align:center}
.emo{font-size:72px;line-height:1.1;margin:4px 0}
.prompt{font-size:20px;font-weight:700;margin:6px auto 14px;max-width:none}
.sentence{font-size:19px;color:var(--muted);margin:0 auto 14px;max-width:46ch}
.sentence .hole{display:inline-block;min-width:4ch;border-bottom:3px solid var(--red);color:transparent}
.big{font-size:clamp(40px,10vw,68px);font-weight:700;letter-spacing:.02em;line-height:1.3;word-break:break-word;
  text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:3px;text-underline-offset:.14em;text-decoration-skip-ink:none}
.gapbox{display:inline-block;min-width:1.4em;background:var(--gap);border:3px dashed var(--sky);border-radius:12px;
  text-decoration:none;color:var(--sky);margin:0 .06em;line-height:1.1;padding:0 .1em;vertical-align:.05em}
.gapbox.filled{border-style:solid;color:var(--ink)}

.syls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.syl{font-size:clamp(26px,6vw,38px);border:0;min-width:64px;padding:6px 16px}
.syl:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(30,42,90,.25)}
.syl.sep{background:var(--sheet)!important;border:2px dashed var(--muted);box-shadow:none;color:var(--ink)}
.c0{background:var(--b1)}.c1{background:var(--b2)}.c2{background:var(--b3)}.c3{background:var(--b4)}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:70px;margin:8px 0 6px;padding:10px;
  border-bottom:3px solid var(--red)}
.slot{min-width:64px;height:58px;border:3px dashed var(--line);border-radius:12px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.tile[disabled]{opacity:.2;cursor:default;box-shadow:none}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:18px}
.opt{background:var(--sheet);border:3px solid var(--line);border-radius:16px;padding:14px 10px;font-size:clamp(22px,5vw,30px);font-weight:700}
.opt:hover:not([disabled]){border-color:var(--sky)}
.opt.right{background:var(--ok-bg);border-color:var(--leaf)}
.opt.wrong{background:var(--bad-bg);border-color:var(--red)}
.opt[disabled]{cursor:default}
.opt small{display:block;font-size:15px;font-weight:400;color:var(--muted)}

.say{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:19px;
  background:var(--sky);color:#fff;box-shadow:0 4px 0 #1d5799}
.say.alt{background:var(--sheet);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}

.typein{font:inherit;font-size:clamp(28px,7vw,40px);font-weight:700;text-align:center;width:100%;max-width:440px;
  padding:10px 14px;border:3px solid var(--line);border-radius:16px;background:var(--sheet);color:var(--ink);margin:16px 0 12px}
.typein:focus{border-color:var(--sky);outline:none}

.fb{margin-top:18px;padding:14px 16px;border-radius:16px;text-align:center}
.fb.ok{background:var(--ok-bg)}
.fb.no{background:var(--bad-bg)}
.fb .h{font-size:24px;font-weight:700}
.fb .ans{font-size:30px;font-weight:700}
.diff span{border-radius:4px}
.diff .x{background:var(--red);color:#fff;padding:0 2px}

.go{border:0;border-radius:14px;padding:14px 28px;font-weight:700;font-size:20px;background:var(--leaf);color:#fff;
  box-shadow:0 4px 0 #136b40;margin-top:14px}
.go.ghost{background:var(--sheet);color:var(--ink);border:2px solid var(--line);box-shadow:none}

.nope{margin-top:10px;font-size:16px;color:var(--muted)}
.nope s{color:var(--red);text-decoration-thickness:2px}

.result{text-align:center;padding:10px 0}
.result .stars{font-size:64px;letter-spacing:8px}
.note{font-size:15px;color:var(--muted);margin-top:22px;max-width:70ch}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){
  .confetti{display:none}
  .topic,.fill{transition:none}
}
@media (max-width:520px){
  .sheet{padding:18px 14px 18px 30px}
  .sheet::before{left:16px}
  .brand .blk{font-size:24px}
  .emo{font-size:58px}
}
</style>
</head>

<div class="wrap" id="app"></div>

const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* speech */
let voice=null;
const hasTTS='speechSynthesis' in window;
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices();
 voice=vs.find(v=>/^ms/i.test(v.lang))||vs.find(v=>/^id/i.test(v.lang))||null}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rate=0.8){
 if(!store.sound||!hasTTS||!text)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text.replace(/-/g,' '));
 u.lang=voice?voice.lang:'ms-MY'; if(voice)u.voice=voice; u.rate=rate;
 speechSynthesis.speak(u);
}
/* bunyi */
let actx=null;
function tone(ok){
 if(!store.sound)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const notes=ok?[660,880]:[300,220];
  notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();
   o.type='sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
   const t=actx.currentTime+i*.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);
   g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22)});
 }catch(e){}
}

function starsHTML(n,max=3){let s='';for(let i=0;i<max;i++)s+=i<n?'★':'<span class="off">★</span>';return `<span class="stars" aria-label="${n} bintang daripada ${max}">${s}</span>`}
function sentenceHole(w){
 const ww=word(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp('(?<![\\p{L}-])'+ww+'(?![\\p{L}-])','iu');
 return re.test(w.s)?esc(w.s).replace(re,'<span class="hole">____</span>'):'';
}
function sentenceBold(w){
 const ww=word(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 const re=new RegExp('(?<![\\p{L}-])('+ww+')(?![\\p{L}-])','iu');
 return esc(w.s).replace(re,'<b>$1</b>');
}
const tileLabel=t=>t==='_'?'␣':t;

/* ===================== ROUND BUILDERS ===================== */
function buildItem(t,aid,w,all){
 const it={w};
 if(aid==='susun'){
  const tk=toks(w);
  const others=all.filter(o=>o!==w).flatMap(toks).filter(x=>x!=='_'&&x!=='-'&&!tk.includes(x));
  it.tiles=shuffle(tk.concat(pick(others,1)));
  it.picked=[];
 }
 if(aid==='hilang'){
  const ws=word(w);
  if(t.mode==='join'){
   const tk=toks(w);let i=tk.indexOf('-'),sep='-';
   if(i<0){i=tk.indexOf('_');sep=' '}
   let L,R;
   if(i>=0){L=tk.slice(0,i).join('');R=tk.slice(i+1).join('')}
   else{sep='';L=tk.slice(0,w.j).join('');R=tk.slice(w.j).join('')}
   it.before=L;it.after=R;it.ans=sep;
   it.opts=[{v:' ',l:'␣',d:'Jarak'},{v:'-',l:'-',d:'Sempang'},{v:'',l:'⟷',d:'Rapat'}];
  }else if(t.mode==='f'){
   const idx=t.pos==='end'?ws.lastIndexOf(w.f):ws.indexOf(w.f);
   it.before=ws.slice(0,idx);it.after=ws.slice(idx+w.f.length);it.ans=w.f;
   it.opts=shuffle([w.f].concat(pick(t.opts.filter(o=>o!==w.f),3))).map(v=>({v,l:v}));
  }else{
   const idxs=[...ws].map((c,i)=>/[a-z]/.test(c)?i:-1).filter(i=>i>=0);
   const idx=idxs[Math.floor(Math.random()*idxs.length)];const c=ws[idx];
   it.before=ws.slice(0,idx);it.after=ws.slice(idx+1);it.ans=c;
   const pool='abdegiklmnoprstuy'.split('').filter(x=>x!==c);
   it.opts=shuffle([c].concat(pick(pool,3))).map(v=>({v,l:v}));
  }
 }
 if(aid==='pilih'){it.opts=shuffle([word(w)].concat(w.x))}
 if(aid==='dengar'){it.typed='';it.hint=false}
 return it;
}
function startRound(tid,aid){
 const t=topic(tid);
 const ws=pick(t.words,Math.min(8,t.words.length));
 S.round={items:ws.map(w=>buildItem(t,aid,w,t.words)),i:0,score:0,done:false,res:null};
 go('game',{tid,aid});
 setTimeout(()=>autoSpeak(),300);
}
function autoSpeak(){const r=S.round;if(!r)return;const it=r.items[r.i];
 if(S.aid==='dengar')speak(word(it.w))}

function feedback(it){
 if(!it.res)return '';

 if(it.res.ok)return `<div class="fb ok" role="status"><div class="h">Betul! 🎉</div><div class="ans">${esc(w)}</div>${nextBtn()}</div>`;

  extra=`<p style="margin:6px auto 0">Jawapan kamu: <span class="diff">${[...u].map((c,i)=>`<span class="${c!==w[i]?'x':''}">${esc(c)}</span>`).join('')}</span></p>`;
 }
 return `<div class="fb no" role="status"><div class="h">Hampir! Ejaan yang betul:</div><div class="ans">${esc(w)}</div>${extra}${nextBtn()}</div>`;
}

   ${toks(w).includes('_')?'<p class="nope">␣ bermaksud jarak antara dua perkataan.</p>':''}`;
 }

 if(S.aid==='hilang'){
  const filled=answered?(it.res.ok?it.ans:it.res.pickedV):null;

 if(S.aid==='dengar'){

 return header()+`<div class="sheet"><div class="result">
  <button class="back" data-act="topic" data-t="${t.id}">‹ ${esc(t.name)}</button>
  <div>${starsHTML(st)}</div>
  <h1>${msg}</h1>
  <p class="muted" style="margin:0 auto">Kamu betul ${r.score} daripada ${r.items.length} soalan.</p>
  <div class="row">
   <button class="go" data-act="act" data-a="${S.aid}">Main lagi</button>
   <button class="go ghost" data-act="topic" data-t="${t.id}">Pilih aktiviti lain</button>
  </div></div></div>`;
}

function render(){
 const v={home:vHome,topic:vTopic,learn:vLearn,game:vGame,result:vResult}[S.view];
 $app.innerHTML=v();
 const inp=document.getElementById('typein');
 if(inp&&!inp.disabled){inp.focus({preventScroll:true});inp.setSelectionRange(inp.value.length,inp.value.length)}
 const nb=document.getElementById('nextbtn');if(nb)nb.focus({preventScroll:true});
}

/* ===================== ACTIONS ===================== */
function answer(ok,extra){
 const r=S.round,it=r.items[r.i];
 it.res=Object.assign({ok},extra);
 if(ok)r.score++;
 tone(ok);
 setTimeout(()=>speak(word(it.w)),250);
 render();
}
function confetti(){
 const box=document.getElementById('confetti');box.innerHTML='';
 const em=['⭐','🎉','✨','🌟','🎈'];
 for(let i=0;i<28;i++){const s=document.createElement('span');s.textContent=em[i%em.length];
  s.style.left=Math.random()*100+'vw';s.style.animationDelay=(Math.random()*.6)+'s';box.appendChild(s)}
 setTimeout(()=>box.innerHTML='',3400);
}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act,r=S.round,it=r&&r.items[r.i];
 const curW=S.view==='learn'?topic(S.tid).words[S.li]:it&&it.w;
 switch(a){
  case 'home':go('home');break;
  case 'sound':store.sound=!store.sound;save();if(!store.sound&&hasTTS)speechSynthesis.cancel();render();break;
  case 'year':store.year=+b.dataset.y;save();render();break;
  case 'topic':go('topic',{tid:b.dataset.t});break;
  case 'act':
   if(b.dataset.a==='learn'){go('learn',{aid:'learn',li:0});setTimeout(()=>speak(word(topic(S.tid).words[0])),250)}
   else startRound(S.tid,b.dataset.a);break;
  case 'lnext':S.li++;render();speak(word(topic(S.tid).words[S.li]));break;
  case 'lprev':S.li--;render();speak(word(topic(S.tid).words[S.li]));break;
  case 'saysyl':speak(b.dataset.s,.7);break;
  case 'sayword':speak(word(curW));break;
  case 'sayslow':speak(word(curW),.5);break;
  case 'saysent':speak(curW.s,.85);break;
  case 'pick':{
   const k=+b.dataset.k;const x=it.tiles[k];if(x!=='_'&&x!=='-')speak(x,.7);
   it.picked.push(k);
   if(it.picked.length===toks(it.w).length){
    const built=it.picked.map(i=>it.tiles[i]).map(t=>t==='_'?' ':t).join('');
    answer(built===word(it.w));
   }else render();
   break;}
  case 'unpick':it.picked.splice(+b.dataset.k,1);render();break;
  case 'hpick':{const o=it.opts[+b.dataset.k];answer(o.v===it.ans,{pickedV:o.v});break;}
  case 'ppick':{const o=it.opts[+b.dataset.k];answer(o===word(it.w),{picked:o});break;}
  case 'hint':it.hint=true;it.typed=(document.getElementById('typein')||{}).value||'';render();break;
  case 'check':checkTyped();break;
  case 'next':
   if(r.i<r.items.length-1){r.i++;render();autoSpeak()}
   else{
    const pct=r.score/r.items.length,st=pct>=.9?3:pct>=.6?2:r.score>0?1:0;
    const key=S.tid+':'+S.aid;if(st>(store.best[key]||0)){store.best[key]=st;save()}
    go('result');if(st>=2)confetti();
   }
   break;
 }
});
function checkTyped(){
 const inp=document.getElementById('typein');if(!inp)return;
 const r=S.round,it=r.items[r.i];
 const v=inp.value.trim().toLowerCase().replace(/\s+/g,' ').replace(/\s*-\s*/g,'-');
 it.typed=inp.value;
 answer(v===word(it.w),{typed:v});
}
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='typein'){e.preventDefault();checkTyped()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='typein'&&S.round){S.round.items[S.round.i].typed=e.target.value}
});

render();
</script>
</body>
</html>
